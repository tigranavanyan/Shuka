# Render alternative: a web service with a persistent disk (paid plan required for disks).
services:
  - type: web
    name: shuka
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: shuka-data
      mountPath: /data
      sizeGB: 1
